<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eee7da">
    <meta name="description" content="A little record, just for ENOLA. 一份可以听见的生日礼物。">
    <meta name="robots" content="noindex, nofollow">
    <title>ENOLA — A little record for you</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css?v=arm-1">
    <script type="module" src="./js/app.js?v=arm-1"></script>
  </head>
  <body>
    <main>
      <section class="sleeve" aria-labelledby="name">
        <div class="edition"><span>A PRIVATE PRESSING</span><span>VOL. <span data-copy="age">24</span></span></div>
        <header class="heading">
          <p class="eyebrow" data-copy="subtitle">HAPPY 24TH BIRTHDAY</p>
          <h1 id="name" data-copy="name">ENOLA</h1>
          <p class="dedication" data-copy="tagline">A LITTLE RECORD, JUST FOR YOU.</p>
        </header>
        <div class="turntable" id="turntable">
          <div class="record-shadow"></div>
          <div class="record" id="record">
            <div class="grooves"></div>
            <button class="label" id="secret" type="button" aria-label="查看歌词" aria-haspopup="dialog">
              <span class="label-top">ONLY FOR YOU</span>
              <span class="label-name" data-copy="name">ENOLA</span>
              <span class="label-rule"></span>
              <span class="label-age">SIDE A <span>·</span> <span data-copy="age">24</span></span>
              <span class="spindle"></span>
              <svg class="whirlpool" viewBox="0 0 100 35" aria-hidden="true"><path d="M8 20C13 0 88 1 91 18C94 34 22 35 21 20C20 8 76 7 78 19C80 28 35 30 34 21C32 14 64 13 65 20C66 25 45 26 46 21"/></svg>
              <span class="label-bottom">WITH ALL MY LOVE</span>
            </button>
          </div>
          <div class="tonearm" id="tonearm" role="slider" tabindex="0" aria-label="唱针角度，向左拨动播放，向右拨回暂停" aria-valuemin="-13" aria-valuemax="30" aria-valuenow="-13"><div class="arm-pivot"></div><div class="arm-shaft"></div><div class="arm-head"></div></div>
        </div>
        <div class="hero-quote">
          <h2 data-copy="quote">跳入漩涡，然后彼此拥抱。</h2>
          <p data-copy="quoteEnglish">Into the whirlpool, into each other's arms.</p>
        </div>
        <p class="gesture-hint">拨动唱针，让声音靠近 · 轻触圆心，展开歌词</p><p class="player-status" id="status" role="status" aria-live="polite">将唱针向左拨到唱片上</p><button id="retry" class="retry" type="button" hidden>重新加载音频 ↻</button>
      </section>

      <audio id="audio" preload="metadata"></audio>
      <noscript>请开启 JavaScript，以使用唱片播放器。</noscript>
    </main>
    <dialog id="lyrics-dialog" aria-labelledby="lyrics-title">
      <div class="lyrics-header"><span class="eyebrow">SIDE A · LYRICS</span><button id="close-lyrics" type="button" aria-label="关闭歌词">×</button></div>
      <h2 id="lyrics-title">人质</h2><p class="lyrics-credit">张惠妹 · 歌词时间轴示例</p>
      <div class="lyrics-lines" id="lyrics-lines" tabindex="0" aria-label="歌词列表"></div>
        <div class="player" aria-busy="false" id="player">
          <button id="play" class="play-button" type="button" aria-label="播放语音" disabled>
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7Z"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
            <span class="spinner" aria-hidden="true"></span>
          </button>
          <div class="timeline"><label class="sr-only" for="seek">播放进度</label><input id="seek" type="range" min="0" max="100" value="0" step="0.1" disabled aria-valuetext="尚未加载"><div class="time"><span id="current">0:00</span><span id="duration">—:—</span></div></div>
        </div>
      <p class="lyrics-note">当前为占位文本，时间轴可后续调整。</p>
    </dialog>
  </body>
</html>
